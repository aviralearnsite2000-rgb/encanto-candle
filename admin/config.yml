# Encanto — Decap CMS admin panel
backend:
  name: github
  repo: aviralearnsite2000-rgb/encanto-candle
  branch: main
  base_url: https://YOUR-OAUTH-HOST
  auth_endpoint: auth

locale: fa
media_folder: "photos"
public_folder: "/photos"

collections:
  - name: "settings"
    label: "site settings"
    files:
      - label: "general"
        name: "site"
        file: "data/store.json"
        fields:
          - { label: "brandFa", name: "site.brandFa", widget: "string", default: "brand" }
          - { label: "brandEn", name: "site.brandEn", widget: "string", default: "ENCANTO CANDLE" }
          - { label: "tagline", name: "site.tagline", widget: "string", required: false }
          - { label: "footer", name: "site.footer", widget: "string", required: false }
          - { label: "instagram", name: "site.instagram", widget: "string", default: "https://instagram.com/encanto._candle" }
          - { label: "bgImage", name: "site.bgImage", widget: "image", required: false, allow_multiple: false }
          - label: "theme"
            name: "site.theme"
            widget: "object"
            fields:
              - { label: "bg", name: "bg", widget: "color", default: "#fff6f9" }
              - { label: "pinkLight", name: "pinkLight", widget: "color", default: "#ffe3ee" }
              - { label: "pink", name: "pink", widget: "color", default: "#f9aecb" }
              - { label: "rose", name: "rose", widget: "color", default: "#d96a9b" }
              - { label: "roseDeep", name: "roseDeep", widget: "color", default: "#b04a78" }
              - { label: "plum", name: "plum", widget: "color", default: "#6e2b47" }
              - { label: "plumSoft", name: "plumSoft", widget: "color", default: "#96607c" }

  - name: "categories"
    label: "categories and products"
    files:
      - label: "categories"
        name: "cats"
        file: "data/store.json"
        fields:
          - label: "categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "title", name: "title", widget: "string" }
              - { label: "slug", name: "slug", widget: "string", hint: "latin, no space. ex: flower-basket" }
              - { label: "desc", name: "desc", widget: "text", required: false }
              - { label: "icon", name: "icon", widget: "string", required: false, default: "icon" }
              - { label: "image", name: "image", widget: "image", required: false, allow_multiple: false }
              - label: "items"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "name", name: "name", widget: "string" }
                  - { label: "desc", name: "desc", widget: "text", required: false }
                  - { label: "price", name: "price", widget: "string" }
                  - { label: "icon", name: "icon", widget: "string", required: false, default: "icon" }
                  - { label: "image", name: "image", widget: "image", required: false, allow_multiple: false }
                  - label: "gallery images"
                    name: "images"
                    widget: "list"
                    required: false
                    field: { label: "photo", name: "photo", widget: "image" }
