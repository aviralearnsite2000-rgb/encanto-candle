# Encanto — Decap CMS admin panel
backend:
  name: github
  repo: aviralearnsite2000-rgb/encanto-candle
  branch: main
  base_url: https://YOUR-OAUTH-HOST
  auth_endpoint: auth

locale: fa
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "⚙️ تنظیمات سایت و رنگ‌ها"
    files:
      - label: "تنظیمات کلی"
        name: "site"
        file: "data/store.json"
        fields:
          - { label: "نام برند (فارسی)", name: "site.brandFa", widget: "string", default: "انکنتو" }
          - { label: "نام برند (انگلیسی)", name: "site.brandEn", widget: "string", default: "ENCANTO CANDLE" }
          - { label: "جمله زیر عنوان", name: "site.tagline", widget: "string", required: false }
          - { label: "متن پاورقی", name: "site.footer", widget: "string", required: false }
          - { label: "لینک اینستاگرام", name: "site.instagram", widget: "string", default: "https://instagram.com/encanto._candle" }
          - { label: "عکس پس‌زمینه صفحه اصلی", name: "site.bgImage", widget: "image", required: false, allow_multiple: false }
          - label: "🎨 رنگ‌های تم"
            name: "site.theme"
            widget: "object"
            fields:
              - { label: "پس‌زمینه", name: "bg", widget: "color", default: "#fff6f9" }
              - { label: "صورتی روشن", name: "pinkLight", widget: "color", default: "#ffe3ee" }
              - { label: "صورتی", name: "pink", widget: "color", default: "#f9aecb" }
              - { label: "رز", name: "rose", widget: "color", default: "#d96a9b" }
              - { label: "رز تیره", name: "roseDeep", widget: "color", default: "#b04a78" }
              - { label: "آلو (متن اصلی)", name: "plum", widget: "color", default: "#6e2b47" }
              - { label: "آلو روشن (متن فرعی)", name: "plumSoft", widget: "color", default: "#96607c" }

  - name: "categories"
    label: "📦 دسته‌بندی‌ها و محصولات"
    files:
      - label: "دسته‌بندی‌ها"
        name: "cats"
        file: "data/store.json"
        fields:
          - label: "دسته‌بندی‌ها"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "نام دسته", name: "title", widget: "string" }
              - { label: "نام انگلیسی (slug) — بدون فاصله", name: "slug", widget: "string", hint: "مثلاً: flower-basket" }
              - { label: "توضیح دسته", name: "desc", widget: "text", required: false }
              - { label: "ایموجی دسته (اگر عکس ندارد)", name: "icon", widget: "string", required: false, default: "🕯️" }
              - { label: "عکس دسته", name: "image", widget: "image", required: false, allow_multiple: false }
              - label: "محصولات این دسته"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "نام محصول", name: "name", widget: "string" }
                  - { label: "توضیح", name: "desc", widget: "text", required: false }
                  - { label: "قیمت", name: "price", widget: "string", hint: "مثلاً: ۸۵۰٬۰۰۰ تومان" }
                  - { label: "ایموجی (اگر عکس ندارد)", name: "icon", widget: "string", required: false, default: "🕯️" }
                  - { label: "عکس محصول", name: "image", widget: "image", required: false, allow_multiple: false }
